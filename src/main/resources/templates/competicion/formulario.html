<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/futbol_theme.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:text="${titulo}">Registrar Competición</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/competiciones/guardar}" th:object="${competicion}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre de la Competición</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required placeholder="Ej. Copa Libertadores" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Premio / Monto ($)</label>
                            <input type="number" step="any" class="form-control" th:field="*{monto}" required placeholder="Ej. 5000000" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Fecha de Inicio</label>
                            <input type="date" class="form-control" th:field="*{fechaInicio}" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Fecha de Finalización</label>
                            <input type="date" class="form-control" th:field="*{fechaFin}" />
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/competiciones}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Competición</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
