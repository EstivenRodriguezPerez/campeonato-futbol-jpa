<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" th:href="@{/css/futbol_theme.css}">
    <meta charset="UTF-8">
    <title>Registros de Competiciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand fw-bold" href="/clubes">🏆 Campeonato Fútbol</a>
    <div class="navbar-nav">
        <a class="nav-link" href="/clubes">Clubes</a>
        <a class="nav-link" href="/entrenadores">Entrenadores</a>
        <a class="nav-link" href="/jugadores">Jugadores</a>
        <a class="nav-link" href="/asociaciones">Asociaciones</a>
        <a class="nav-link active" href="/competiciones">Competiciones</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>📋 Registros de Competiciones</h3>
        <a th:href="@{/competiciones/nuevo}" class="btn btn-primary">+ Nueva Competición</a>
    </div>

    <div class="card shadow-sm border-0">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Competición</th>
                    <th>Premio (USD)</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Fin</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="comp : ${competiciones}">
                    <td class="text-muted font-monospace" th:text="${comp.id}"></td>
                    <td class="fw-bold" th:text="${comp.nombre}"></td>
                    <td class="text-success fw-semibold" th:text="'$' + ${#numbers.formatDecimal(comp.montoPremio, 0, 'COMMA', 0, 'POINT')} + ' USD'"></td>
                    <td th:text="${comp.fechaInicio}"></td>
                    <td th:text="${comp.fechaFin}"></td>
                    <td class="text-end">
                        <a th:href="@{/competiciones/editar/{id}(id=${comp.id})}" class="btn btn-sm btn-outline-warning">Editar</a>
                        <a th:href="@{/competiciones/eliminar/{id}(id=${comp.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar esta competición?')">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(competiciones)}">
                    <td colspan="6" class="text-center text-muted py-4">No hay competiciones registradas aún.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
