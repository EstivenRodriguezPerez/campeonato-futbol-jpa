<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Competiciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/futbol_theme.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold">Competiciones</h2>
        <div>
            <a th:href="@{/}" class="btn btn-outline-secondary me-2">Inicio</a>
            <a th:href="@{/competiciones/nuevo}" class="btn btn-success">+ Nueva Competición</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Premio (Monto)</th>
                            <th>Fecha Inicio</th>
                            <th>Fecha Fin</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="comp : ${competiciones}">
                            <td th:text="${comp.id}">1</td>
                            <td class="fw-semibold" th:text="${comp.nombre}">Champions League</td>
                            <td th:text="${comp.monto}">10000000</td>
                            <td th:text="${comp.fechaInicio}">2026-09-01</td>
                            <td th:text="${comp.fechaFin}">2027-05-30</td>
                            <td class="text-center">
                                <a th:href="@{/competiciones/editar/{id}(id=${comp.id})}" class="btn btn-sm btn-outline-primary me-1">Editar</a>
                                <a th:href="@{/competiciones/eliminar/{id}(id=${comp.id})}" class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('¿Seguro que deseas eliminar esta competición?');">Eliminar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(competiciones)}">
                            <td colspan="6" class="text-center text-muted py-4">No hay competiciones registradas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
