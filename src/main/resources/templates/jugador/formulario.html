<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/futbol_theme.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:text="${titulo}">Registrar Jugador</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/jugadores/guardar}" th:object="${jugador}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required placeholder="Ej. James" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Apellidos</label>
                            <input type="text" class="form-control" th:field="*{apellidos}" required placeholder="Ej. Rodríguez" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Posición</label>
                            <input type="text" class="form-control" th:field="*{posicion}" required placeholder="Ej. Mediocampista" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Dorsal / Número</label>
                            <input type="number" class="form-control" th:field="*{numero}" required placeholder="Ej. 10" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Club</label>
                            <select class="form-select" th:field="*{club}">
                                <option value="">-- Agente Libre / Sin Club --</option>
                                <option th:each="c : ${clubes}" 
                                        th:value="${c.id}" 
                                        th:text="${c.nombre}"></option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/jugadores}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Jugador</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
