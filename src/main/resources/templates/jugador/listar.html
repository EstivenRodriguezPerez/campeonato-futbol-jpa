<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Jugadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/futbol_theme.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold">Plantilla de Jugadores</h2>
        <div>
            <a th:href="@{/}" class="btn btn-outline-secondary me-2">Inicio</a>
            <a th:href="@{/jugadores/nuevo}" class="btn btn-success">+ Nuevo Jugador</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Nombre Completo</th>
                            <th>Posición</th>
                            <th>Número</th>
                            <th>Club</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="j : ${jugadores}">
                            <td th:text="${j.id}">1</td>
                            <td class="fw-semibold" th:text="${j.nombre + ' ' + j.apellidos}">Luis Díaz</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${j.posicion}">Delantero</span>
                            </td>
                            <td th:text="${j.numero}">7</td>
                            <td th:text="${j.club != null ? j.club.nombre : 'Agente Libre'}">Liverpool FC</td>
                            <td class="text-center">
                                <a th:href="@{/jugadores/editar/{id}(id=${j.id})}" class="btn btn-sm btn-outline-primary me-1">Editar</a>
                                <a th:href="@{/jugadores/eliminar/{id}(id=${j.id})}" class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('¿Seguro que deseas eliminar este jugador?');">Eliminar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(jugadores)}">
                            <td colspan="6" class="text-center text-muted py-4">No hay jugadores registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
