<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Clubes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/futbol_theme.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold">Clubes de Fútbol</h2>
        <div>
            <a th:href="@{/}" class="btn btn-outline-secondary me-2">Inicio</a>
            <a th:href="@{/clubes/nuevo}" class="btn btn-success">+ Nuevo Club</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Entrenador</th>
                            <th>Asociación</th>
                            <th>Competiciones</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${clubes}">
                            <td th:text="${c.id}">1</td>
                            <td class="fw-semibold" th:text="${c.nombre}">Atlético Bucaramanga</td>
                            <td th:text="${c.entrenador != null ? (c.entrenador.nombre + ' ' + c.entrenador.apellidos) : 'Sin asignar'}">Rafael Dudamel</td>
                            <td th:text="${c.asociacion != null ? c.asociacion.nombre : 'Sin asignar'}">Dimayor</td>
                            <td>
                                <span class="badge bg-info text-dark me-1" th:each="comp : ${c.competiciones}" th:text="${comp.nombre}">Liga BetPlay</span>
                                <span class="text-muted" th:if="${#lists.isEmpty(c.competiciones)}">Ninguna</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/clubes/editar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary me-1">Editar</a>
                                <a th:href="@{/clubes/eliminar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('¿Seguro que deseas eliminar este club?');">Eliminar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clubes)}">
                            <td colspan="6" class="text-center text-muted py-4">No hay clubes registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
