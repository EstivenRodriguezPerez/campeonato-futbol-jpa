<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/futbol_theme.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:text="${titulo}">Registrar Club</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/clubes/guardar}" th:object="${club}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre del Club</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required placeholder="Ej. Real Madrid CF" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Entrenador Principal</label>
                            <select class="form-select" th:field="*{entrenador}">
                                <option value="">-- Seleccionar Entrenador --</option>
                                <option th:each="ent : ${entrenadores}" 
                                        th:value="${ent.id}" 
                                        th:text="${ent.nombre + ' ' + ent.apellidos}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Asociación</label>
                            <select class="form-select" th:field="*{asociacion}">
                                <option value="">-- Seleccionar Asociación --</option>
                                <option th:each="asoc : ${asociaciones}" 
                                        th:value="${asoc.id}" 
                                        th:text="${asoc.nombre + ' (' + asoc.pais + ')'}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Competiciones (Usa Ctrl / Cmd para seleccionar varias)</label>
                            <select class="form-select" th:field="*{competiciones}" multiple size="4">
                                <option th:each="comp : ${competiciones}" 
                                        th:value="${comp.id}" 
                                        th:text="${comp.nombre}"></option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/clubes}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Club</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
