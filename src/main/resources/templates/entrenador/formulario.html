<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" th:href="@{/css/futbol_theme.css}">
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:text="${titulo}"></h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/entrenadores/guardar}" th:object="${entrenador}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required placeholder="Ej. Alberto" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Apellido</label>
                            <input type="text" class="form-control" th:field="*{apellido}" required placeholder="Ej. Gamero" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Edad</label>
                            <input type="number" class="form-control" th:field="*{edad}" required min="18" max="99" placeholder="Ej. 60" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nacionalidad</label>
                            <input type="text" class="form-control" th:field="*{nacionalidad}" required placeholder="Ej. Colombiana" />
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/entrenadores/listar}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Entrenador</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
