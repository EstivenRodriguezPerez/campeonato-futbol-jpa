<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Entrenadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/futbol_theme.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold">Cuerpo Técnico - Entrenadores</h2>
        <div>
            <a th:href="@{/}" class="btn btn-outline-secondary me-2">Inicio</a>
            <a th:href="@{/entrenadores/nuevo}" class="btn btn-success">+ Nuevo Entrenador</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Nombre Completo</th>
                            <th>Edad</th>
                            <th>Nacionalidad</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ent : ${entrenadores}">
                            <td th:text="${ent.id}">1</td>
                            <td class="fw-semibold" th:text="${ent.nombre + ' ' + ent.apellidos}">Pep Guardiola</td>
                            <td th:text="${ent.edad}">53</td>
                            <td th:text="${ent.nacionalidad}">España</td>
                            <td class="text-center">
                                <a th:href="@{/entrenadores/editar/{id}(id=${ent.id})}" class="btn btn-sm btn-outline-primary me-1">Editar</a>
                                <a th:href="@{/entrenadores/eliminar/{id}(id=${ent.id})}" class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('¿Seguro que deseas eliminar este entrenador?');">Eliminar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(entrenadores)}">
                            <td colspan="5" class="text-center text-muted py-4">No hay entrenadores registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
