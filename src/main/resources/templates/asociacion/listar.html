<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Asociaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/futbol_theme.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold">Asociaciones de Fútbol</h2>
        <div>
            <a th:href="@{/}" class="btn btn-outline-secondary me-2">Inicio</a>
            <a th:href="@{/asociaciones/nuevo}" class="btn btn-success">+ Nueva Asociación</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>País</th>
                            <th>Presidente</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="asoc : ${asociaciones}">
                            <td th:text="${asoc.id}">1</td>
                            <td class="fw-semibold" th:text="${asoc.nombre}">FIFA</td>
                            <td th:text="${asoc.pais}">Suiza</td>
                            <td th:text="${asoc.presidente}">Gianni Infantino</td>
                            <td class="text-center">
                                <a th:href="@{/asociaciones/editar/{id}(id=${asoc.id})}" class="btn btn-sm btn-outline-primary me-1">Editar</a>
                                <a th:href="@{/asociaciones/eliminar/{id}(id=${asoc.id})}" class="btn btn-sm btn-outline-danger" 
                                   onclick="return confirm('¿Seguro que deseas eliminar esta asociación?');">Eliminar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(asociaciones)}">
                            <td colspan="5" class="text-center text-muted py-4">No hay asociaciones registradas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
