<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" th:href="@{/css/futbol_theme.css}">
    <meta charset="UTF-8">
    <title>Registros de Asociaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand fw-bold" href="/clubes">🏆 Campeonato Fútbol</a>
    <div class="navbar-nav">
        <a class="nav-link" href="/clubes">Clubes</a>
        <a class="nav-link" href="/entrenadores">Entrenadores</a>
        <a class="nav-link" href="/jugadores">Jugadores</a>
        <a class="nav-link active" href="/asociaciones">Asociaciones</a>
        <a class="nav-link" href="/competiciones">Competiciones</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>📋 Registros de Asociaciones</h3>
        <a th:href="@{/asociaciones/nuevo}" class="btn btn-primary">+ Nueva Asociación</a>
    </div>

    <div class="card shadow-sm border-0">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre de la Asociación</th>
                    <th>País</th>
                    <th>Presidente</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="asoc : ${asociaciones}">
                    <td class="text-muted font-monospace" th:text="${asoc.id}"></td>
                    <td class="fw-bold" th:text="${asoc.nombre}"></td>
                    <td><span class="badge bg-secondary" th:text="${asoc.pais}"></span></td>
                    <td th:text="${asoc.presidente}"></td>
                    <td class="text-end">
                        <a th:href="@{/asociaciones/editar/{id}(id=${asoc.id})}" class="btn btn-sm btn-outline-warning">Editar</a>
                        <a th:href="@{/asociaciones/eliminar/{id}(id=${asoc.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar esta asociación?')">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(asociaciones)}">
                    <td colspan="5" class="text-center text-muted py-4">No hay asociaciones registradas aún.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
