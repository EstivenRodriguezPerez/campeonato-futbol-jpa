<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" th:href="@{/css/futbol_theme.css}">
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0" th:text="${titulo}"></h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/asociaciones/guardar}" th:object="${asociacion}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre de la Asociación</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required placeholder="Ej. Federación Colombiana de Fútbol" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">País</label>
                            <input type="text" class="form-control" th:field="*{pais}" required placeholder="Ej. Colombia" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Presidente</label>
                            <input type="text" class="form-control" th:field="*{presidente}" required placeholder="Ej. Ramón Jesurún" />
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/asociaciones/listar}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Asociación</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
